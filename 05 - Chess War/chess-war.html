<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chess War</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        #menuBar {
            width: 100%;
            height: clamp(50px, 8vh, 70px);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 clamp(15px, 3vw, 40px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(78, 205, 196, 0.2);
            position: relative;
            z-index: 10;
        }

        #homeButton {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            letter-spacing: 0.5px;
        }

        #homeButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        #homeButton:active {
            transform: translateY(0);
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 20px;
            margin: 20px;
            align-items: center;
            border: 4px solid #ffd700;
            background: #2d2d44;
            max-width: 1300px;
            position: relative;
        }

        #readyOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 18, 0.12);
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 24px rgba(255, 215, 0, 0.6);
            z-index: 20;
            pointer-events: none;
            letter-spacing: 2px;
            text-align: center;
        }

        #readyOverlayMain {
            font-size: 54px;
            line-height: 1.1;
        }

        #readyOverlayHint {
            margin-top: 10px;
            font-size: 18px;
            color: #fff7d1;
            letter-spacing: 0.8px;
        }

        #gameView {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        #gameTitle {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        #gameCanvas {
            display: block;
            background: #2d2d44;
            cursor: pointer;
        }

        .player2 {
            opacity: 0.7;
            pointer-events: none;
            display: none;
        }

        .player2 h2::after {
            content: " 🤖";
            font-size: 20px;
        }

        #uiPanel {
            display: flex;
            gap: 40px;
            background: transparent;
            padding: 15px 0 0 0;
            border-radius: 0;
            border: none;
            border-top: 2px solid #ffd700;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        .playerInfo {
            display: flex;
            flex-direction: row;
            gap: 15px;
            text-align: center;
            align-items: center;
        }

        .playerInfo h2 {
            font-size: 14px;
            margin-bottom: 0;
            color: #ffd700;
            white-space: nowrap;
            order: 1;
        }

        .player1 h2 {
            color: #4a90e2;
        }

        .player2 h2 {
            color: #e24a4a;
        }

        .coins {
            font-size: 13px;
            color: #ffd700;
            white-space: nowrap;
            order: 2;
        }

        .shop {
            display: flex;
            flex-direction: column;
            gap: 10px;            order: 4;        }

        .shop {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        .pieceButton {
            padding: 8px 10px;
            border: 2px solid #555;
            border-radius: 4px;
            background: #333;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            min-width: 50px;
            font-weight: bold;
        }

        .pieceButton span:first-child {
            font-size: 28px;
            display: block;
            line-height: 1;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .pieceButton span:last-child {
            font-size: 12px;
            color: #ffd700;
            font-weight: bold;
        }

        .pieceButton:hover:not(:disabled) {
            background: #444;
            border-color: #ffd700;
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .pieceButton:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pieceButton.selected {
            background: #ffd700;
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .pieceButton.selected span:first-child {
            color: #000;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .pieceButton.selected span:last-child {
            color: #000;
        }

        .cooldown {
            font-size: 10px;
            color: #ff6b6b;
            order: 3;
            display: none;
        }

        #gameStats {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        #turnDisplay {
            font-weight: bold;
        }

        #cooldownDisplay {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 5px;
            border: 1px solid #ffd700;
        }

        #cooldownBar {
            width: 80px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            overflow: hidden;
        }

        #cooldownBarFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4ade80, #fbbf24);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        #cooldownText {
            font-size: 12px;
            min-width: 30px;
            display: none;
        }

        #balancePanel {
            width: 100%;
            margin: 8px 0 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 10px;
            padding: 10px 12px;
        }

        #balancePanel h3 {
            margin-bottom: 8px;
            font-size: 14px;
            color: #ffd700;
            letter-spacing: 0.6px;
        }

        #pieceStatsTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        #pieceStatsTable th,
        #pieceStatsTable td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 6px;
            text-align: center;
        }

        #pieceStatsTable th {
            color: #ffe9a0;
            font-weight: 700;
        }

        .balanceMeta {
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.45;
        }

        #autoTestControls {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        #autoTestControls input {
            width: 80px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        #runAutoTestBtn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.55);
            background: rgba(255, 215, 0, 0.14);
            color: #ffe9a0;
            font-weight: 700;
            cursor: pointer;
        }

        #runAutoTestBtn:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        #autoTestResult {
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.9);
        }

        #buyFeedback {
            width: 100%;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.9);
        }

        #buyFeedback.success {
            color: #7ef7ae;
            border-color: rgba(126, 247, 174, 0.6);
        }

        #buyFeedback.error {
            color: #ff9b9b;
            border-color: rgba(255, 155, 155, 0.6);
        }

        #instructions {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            max-width: 800px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .stats {
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="menuBar">
        <button id="homeButton" onclick="window.location.href='../index.html'">← HOME</button>
    </div>

    <div id="gameContainer">
        <h1 id="gameTitle">⚔️ CHESS WAR ⚔️</h1>
        <div id="readyOverlay">
            <div>
                <div id="readyOverlayMain">PREPARE 5</div>
                <div id="readyOverlayHint">Buy and place your pieces</div>
            </div>
        </div>
        
        <div id="gameStats">
            <div id="cooldownDisplay">
                ⏱️ 
                <div id="cooldownBar"><div id="cooldownBarFill"></div></div>
                <span id="cooldownText">4.0s</span>
            </div>
        </div>

        <div id="balancePanel">
            <h3>Balance Monitor</h3>
            <table id="pieceStatsTable">
                <thead>
                    <tr>
                        <th>Piece</th>
                        <th>Price</th>
                        <th>HP</th>
                        <th>DMG</th>
                        <th>Move</th>
                        <th>Atk CD</th>
                    </tr>
                </thead>
                <tbody id="pieceStatsBody"></tbody>
            </table>
            <div class="balanceMeta" id="balanceMeta"></div>
            <div id="autoTestControls">
                <label for="autoTestRuns">Auto test runs</label>
                <input id="autoTestRuns" type="number" min="5" max="500" value="50">
                <button id="runAutoTestBtn" type="button">Run AI Test</button>
            </div>
            <div id="autoTestResult">Run AI Test to estimate balance without manual play.</div>
        </div>
        
        <div id="gameView">
            <canvas id="gameCanvas" width="1100" height="700"></canvas>
        </div>
        
        <div id="uiPanel">
            <div class="playerInfo player1">
                <h2>👑 P1</h2>
                <div class="coins">💰 <span id="p1Coins">50</span></div>
                <div class="cooldown" id="p1Cooldown"></div>
                <div class="shop">
                    <button class="pieceButton" data-piece="pawn" data-player="1">
                        <span>♟</span>
                        <span>10💰</span>
                    </button>
                    
                    <button class="pieceButton" data-piece="bishop" data-player="1">
                        <span>♗</span>
                        <span>30💰</span>
                    </button>
                    
                    <button class="pieceButton" data-piece="rook" data-player="1">
                        <span>♜</span>
                        <span>50💰</span>
                    </button>
                    
                    <button class="pieceButton" data-piece="knight" data-player="1">
                        <span>♞</span>
                        <span>70💰</span>
                    </button>
                </div>
            </div>

            <div class="playerInfo player2">
                <h2>👑 P2 🤖</h2>
                <div class="coins">💰 <span id="p2Coins">50</span></div>
                <div class="cooldown" id="p2Cooldown"></div>
            </div>
        </div>

        <div id="buyFeedback">Select a piece, then click your deployment row to place it.</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const BOARD_SIZE = 8;
        const TILE_WIDTH = 130;
        const TILE_HEIGHT = 65;
        const PIECE_SCALE = 70;
        const ACTION_COOLDOWN = 1500; // 1.5 seconds
        const BUYING_COOLDOWN = 1000; // 1 second
        const READY_DURATION = 5000; // 5 seconds
        const COIN_TICK_INTERVAL = 1000; // 1 second
        const COIN_TICK_AMOUNT = 2; // +2 coins/sec
        const AUTO_TEST_MAX_STEPS = 220;

        // Piece costs and stats
        const PIECE_DATA = {
            pawn: { cost: 10, health: 3, damage: 1, moveRange: 1, symbol: '♟' },
            bishop: { cost: 30, health: 5, damage: 2, moveRange: 3, symbol: '♗' },
            rook: { cost: 50, health: 10, damage: 1, moveRange: 4, symbol: '♜' },
            knight: { cost: 70, health: 5, damage: 4, moveRange: 1, symbol: '♞' },
            king: { cost: 0, health: 20, damage: 0, moveRange: 0, symbol: '♚' }
        };

        // Game state
        const gameState = {
            board: Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null)),
            pieces: [],
            players: [
                { id: 1, coins: 50, color: '#4a90e2', lastBuyTime: 0 },
                { id: 2, coins: 50, color: '#e24a4a', lastBuyTime: 0 }
            ],
            selectedPieceType: null,
            selectedPlayer: null,
            gameStartTime: Date.now(),
            matchStartAt: Date.now() + READY_DURATION,
            isMatchStarted: false,
            lastCoinTickAt: Date.now()
        };

        let feedbackTimeout = null;

        // Piece class
        class Piece {
            constructor(type, player, row, col) {
                this.type = type;
                this.player = player;
                this.row = row;
                this.col = col;
                this.health = PIECE_DATA[type].health;
                this.maxHealth = PIECE_DATA[type].health;
                this.damage = PIECE_DATA[type].damage;
                this.moveRange = PIECE_DATA[type].moveRange;
                this.id = Math.random();
                this.hitTime = 0;
                this.fadeOut = false;
                this.fadeOutTime = 0;
                
                // Animation states
                this.isMoving = false;
                this.moveStartTime = 0;
                this.moveDuration = 1000; // 1s movement animation
                this.targetRow = row;
                this.targetCol = col;
                this.lockedTargetId = null;
                this.behaviorState = 'seeking';
                this.prevRow = row;
                this.prevCol = col;
                
                // Attack cooldown - independent from movement
                this.lastAttackTime = Date.now();
                this.attackCooldown = 1500; // 1.5 seconds
            }
            
            canAttack() {
                return Date.now() - this.lastAttackTime >= this.attackCooldown;
            }

            update() {
                if (this.isMoving) return;

                if (this.type === 'king') return; // Kings don't move

                const adjacentEnemy = this.findAdjacentEnemy();
                if (adjacentEnemy) {
                    // Once pieces engage, lock both pieces in place to fight to the death.
                    this.lockedTargetId = adjacentEnemy.id;
                    adjacentEnemy.lockedTargetId = this.id;
                    this.behaviorState = 'engaged';
                    adjacentEnemy.behaviorState = 'engaged';
                    return;
                }

                const enemy = this.resolveTarget();
                
                if (enemy) {
                    // Already in contact with target: hold position and fight.
                    if (this.isAdjacent(enemy)) {
                        this.behaviorState = 'engaged';
                        // Don't move, just prepare for attack
                    } else {
                        const moved = this.moveToward(enemy);
                        if (!moved) {
                            this.behaviorState = 'defending';
                        }
                    }
                } else {
                    this.behaviorState = 'seeking';
                }
            }
            
            updateAttack() {
                // Separate attack update - runs independently of turn system
                if (!this.canAttack() || this.health <= 0) return;
                
                if (this.type === 'king') return; // Kings don't attack
                
                const enemy = this.resolveTarget();
                if (!enemy) return;

                // Check if adjacent and can attack
                if (this.isAdjacent(enemy)) {
                    this.attack(enemy);
                    this.lastAttackTime = Date.now();
                }
            }

            findAdjacentEnemy() {
                return gameState.pieces.find(
                    p => p.player !== this.player && p.health > 0 && this.isAdjacent(p)
                ) || null;
            }

            resolveTarget() {
                if (this.lockedTargetId !== null) {
                    const lockedTarget = gameState.pieces.find(p => p.id === this.lockedTargetId && p.health > 0);
                    if (lockedTarget) {
                        return lockedTarget;
                    }
                    this.lockedTargetId = null;
                    this.behaviorState = 'seeking';
                }

                const newTarget = this.findTarget();
                if (newTarget) {
                    this.lockedTargetId = newTarget.id;
                }
                return newTarget;
            }

            isAdjacent(other) {
                const dr = Math.abs(this.row - other.row);
                const dc = Math.abs(this.col - other.col);
                return dr <= 1 && dc <= 1 && (dr + dc > 0);
            }

            findTarget() {
                const enemies = gameState.pieces.filter(p => p.player !== this.player && p.health > 0);
                if (enemies.length === 0) return null;

                if (this.type === 'pawn') {
                    // Find nearest enemy
                    return enemies.reduce((nearest, enemy) => {
                        const dist = Math.abs(this.row - enemy.row) + Math.abs(this.col - enemy.col);
                        const nearestDist = Math.abs(this.row - nearest.row) + Math.abs(this.col - nearest.col);
                        return dist < nearestDist ? enemy : nearest;
                    });
                } else if (this.type === 'bishop') {
                    // Prefers king but attacks enemies on the way
                    const king = enemies.find(e => e.type === 'king');
                    const enemiesOnPath = enemies.filter(e => this.isOnDiagonal(e));
                    return enemiesOnPath.length > 0 ? enemiesOnPath[0] : king || enemies[0];
                } else if (this.type === 'knight' || this.type === 'rook') {
                    return enemies[0];
                }

                return enemies[0];
            }

            isOnDiagonal(other) {
                return Math.abs(this.row - other.row) === Math.abs(this.col - other.col);
            }

            moveToward(target) {
                let bestMove = null;
                let bestDist = Infinity;
                const currentDist = Math.abs(this.row - target.row) + Math.abs(this.col - target.col);

                const moves = this.getPossibleMoves();
                
                for (const move of moves) {
                    const dist = Math.abs(move.row - target.row) + Math.abs(move.col - target.col);
                    if (dist > currentDist) {
                        continue;
                    }

                    let score = dist;
                    if (move.row === this.prevRow && move.col === this.prevCol) {
                        score += 1.5;
                    }

                    if (score < bestDist) {
                        bestDist = dist;
                        bestMove = move;
                    }
                }

                if (bestMove && bestDist >= currentDist) {
                    bestMove = null;
                }

                if (bestMove) {
                    this.prevRow = this.row;
                    this.prevCol = this.col;
                    gameState.board[this.row][this.col] = null;
                    this.targetRow = bestMove.row;
                    this.targetCol = bestMove.col;
                    this.isMoving = true;
                    this.moveStartTime = Date.now();
                    this.behaviorState = 'seeking';
                    // Update board immediately for collision detection
                    gameState.board[bestMove.row][bestMove.col] = this;
                    return true;
                }

                return false;
            }
            
            updateAnimation() {
                // Update movement animation
                if (this.isMoving) {
                    const elapsed = Date.now() - this.moveStartTime;
                    if (elapsed >= this.moveDuration) {
                        // Movement complete
                        this.row = this.targetRow;
                        this.col = this.targetCol;
                        this.isMoving = false;
                    }
                }
            }
            
            getDisplayPosition() {
                if (this.isMoving) {
                    const elapsed = Date.now() - this.moveStartTime;
                    const progress = Math.min(elapsed / this.moveDuration, 1);
                    
                    // Smooth easing (ease-out cubic)
                    const easeProgress = 1 - Math.pow(1 - progress, 3);
                    
                    return {
                        row: this.row + (this.targetRow - this.row) * easeProgress,
                        col: this.col + (this.targetCol - this.col) * easeProgress
                    };
                }
                return { row: this.row, col: this.col };
            }

            getPossibleMoves() {
                const moves = [];

                if (this.type === 'pawn') {
                    const forward = this.player === 1 ? -1 : 1;
                    const directions = [
                        [forward, 0],
                        [forward, 1],
                        [forward, -1],
                        [0, 1],
                        [0, -1]
                    ];
                    for (const [dr, dc] of directions) {
                        const newRow = this.row + dr;
                        const newCol = this.col + dc;
                        if (this.isValidPosition(newRow, newCol) && !gameState.board[newRow][newCol]) {
                            moves.push({ row: newRow, col: newCol });
                        }
                    }
                } else if (this.type === 'bishop') {
                    const directions = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
                    for (const [dr, dc] of directions) {
                        for (let i = 1; i <= this.moveRange; i++) {
                            const newRow = this.row + dr * i;
                            const newCol = this.col + dc * i;
                            if (!this.isValidPosition(newRow, newCol)) break;
                            if (gameState.board[newRow][newCol]) break;
                            moves.push({ row: newRow, col: newCol });
                        }
                    }
                } else if (this.type === 'rook') {
                    const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                    for (const [dr, dc] of directions) {
                        for (let i = 1; i <= this.moveRange; i++) {
                            const newRow = this.row + dr * i;
                            const newCol = this.col + dc * i;
                            if (!this.isValidPosition(newRow, newCol)) break;
                            if (gameState.board[newRow][newCol]) break;
                            moves.push({ row: newRow, col: newCol });
                        }
                    }
                } else if (this.type === 'knight') {
                    const knightMoves = [
                        [2, 1], [2, -1], [-2, 1], [-2, -1],
                        [1, 2], [1, -2], [-1, 2], [-1, -2]
                    ];
                    for (const [dr, dc] of knightMoves) {
                        const newRow = this.row + dr;
                        const newCol = this.col + dc;
                        if (this.isValidPosition(newRow, newCol) && !gameState.board[newRow][newCol]) {
                            moves.push({ row: newRow, col: newCol });
                        }
                    }
                }

                return moves;
            }

            isValidPosition(row, col) {
                return row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE;
            }

            attack(enemy) {
                enemy.health -= this.damage;
                enemy.hitTime = Date.now(); // Trigger hit effect
                
                if (enemy.health <= 0) {
                    if (this.lockedTargetId === enemy.id) {
                        this.lockedTargetId = null;
                    }
                    enemy.fadeOut = true;
                    enemy.fadeOutTime = Date.now();
                    this.removePiece(enemy);
                    // Award coins
                    const player = gameState.players[this.player - 1];
                    const coinReward = enemy.type === 'king' ? 0 : (PIECE_DATA[enemy.type].cost / 2);
                    player.coins += coinReward;
                }
            }

            removePiece(piece) {
                gameState.board[piece.row][piece.col] = null;
                const index = gameState.pieces.indexOf(piece);
                if (index > -1) {
                    gameState.pieces.splice(index, 1);
                }

                // Check for game over
                if (piece.type === 'king') {
                    setTimeout(() => {
                        alert(`Player ${this.player} wins! The enemy king has fallen!`);
                        location.reload();
                    }, 100);
                }
            }
        }

        // Initialize game
        function initGame() {
            // Place Player 2's king at (0, 4)
            const king2 = new Piece('king', 2, 0, 4);
            gameState.pieces.push(king2);
            gameState.board[0][4] = king2;

            // Place Player 1's king at (7, 4)
            const king1 = new Piece('king', 1, 7, 4);
            gameState.pieces.push(king1);
            gameState.board[7][4] = king1;
        }

        // Convert board coordinates to isometric screen coordinates
        function boardToScreen(row, col) {
            const x = (col - row) * (TILE_WIDTH / 2) + canvas.width / 2;
            const y = (col + row) * (TILE_HEIGHT / 2) + 80;
            return { x, y };
        }

        // Convert screen coordinates to board coordinates
        function screenToBoard(screenX, screenY) {
            const offsetX = screenX - canvas.width / 2;
            const offsetY = screenY - 80;
            
            const col = (offsetX / (TILE_WIDTH / 2) + offsetY / (TILE_HEIGHT / 2)) / 2;
            const row = (offsetY / (TILE_HEIGHT / 2) - offsetX / (TILE_WIDTH / 2)) / 2;
            
            return {
                row: Math.floor(row),
                col: Math.floor(col)
            };
        }

        // Draw highlighted rows for piece placement
        function drawHighlightedRows() {
            if (!gameState.selectedPieceType || !gameState.selectedPlayer) return;
            
            const validRows = gameState.selectedPlayer === 1 ? [6, 7] : [0, 1];
            
            for (let row of validRows) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const { x, y } = boardToScreen(row, col);
                    
                    // Draw highlighted tile
                    ctx.save();
                    ctx.translate(x, y);
                    
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    ctx.lineTo(0, TILE_HEIGHT);
                    ctx.lineTo(-TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }
        }

        // Draw the isometric board
        function drawBoard() {
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const { x, y } = boardToScreen(row, col);
                    
                    // Draw tile
                    ctx.save();
                    ctx.translate(x, y);
                    
                    const isLight = (row + col) % 2 === 0;
                    ctx.fillStyle = isLight ? '#d4a574' : '#8b6f47';
                    
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    ctx.lineTo(0, TILE_HEIGHT);
                    ctx.lineTo(-TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = '#5a4a30';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }
        }

        // Draw pieces
        function drawPieces() {
            // Sort pieces by y-coordinate for proper layering
            const sortedPieces = [...gameState.pieces].sort((a, b) => {
                const posA = boardToScreen(a.row, a.col);
                const posB = boardToScreen(b.row, b.col);
                return posA.y - posB.y;
            });

            for (const piece of sortedPieces) {
                if (piece.health <= 0 && !piece.fadeOut) continue;

                const displayPos = piece.getDisplayPosition();
                const { x, y } = boardToScreen(displayPos.row, displayPos.col);
                
                // Calculate fade out effect
                let alpha = 1;
                if (piece.fadeOut) {
                    const fadeOutDuration = 500; // 500ms fade out
                    const fadeProgress = Math.min((Date.now() - piece.fadeOutTime) / fadeOutDuration, 1);
                    alpha = 1 - fadeProgress;
                }
                
                // Calculate health percentage
                const healthPercent = piece.health / piece.maxHealth;
                
                // Draw piece shadow on the tile
                ctx.fillStyle = `rgba(0, 0, 0, ${0.4 * alpha})`;
                ctx.beginPath();
                ctx.ellipse(x, y + 30, TILE_WIDTH / 4.5, TILE_HEIGHT / 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Get piece color and blend with grey based on health
                const playerColor = gameState.players[piece.player - 1].color;
                const finalColor = healthPercent >= 1 ? playerColor : interpolateColor(playerColor, '#808080', 1 - healthPercent);

                // Calculate hit effect (scale animation)
                const hitDuration = 200; // 200ms hit effect
                const timeSinceHit = Date.now() - piece.hitTime;
                let scale = 1;
                let hitFlash = 0;
                if (timeSinceHit < hitDuration) {
                    const hitProgress = timeSinceHit / hitDuration;
                    scale = 1 + (0.3 * (1 - hitProgress)); // Stronger scale effect
                    hitFlash = (1 - hitProgress) * 0.5; // Red flash effect
                }

                // Draw piece standing on the tile
                ctx.fillStyle = finalColor;
                ctx.font = `${PIECE_SCALE * scale}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = alpha;
                
                // Add hit flash effect (red overlay)
                if (hitFlash > 0) {
                    ctx.fillStyle = `rgba(255, 100, 100, ${hitFlash})`;
                    ctx.fillRect(x - PIECE_SCALE * 0.5, y - PIECE_SCALE * 0.5, PIECE_SCALE, PIECE_SCALE);
                }
                
                // Add glow effect
                ctx.fillStyle = finalColor;
                ctx.shadowColor = finalColor;
                ctx.shadowBlur = 15;
                ctx.fillText(PIECE_DATA[piece.type].symbol, x, y + 10);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        // Helper function to interpolate between two colors
        function interpolateColor(color1, color2, percent) {
            // Parse colors
            const c1 = parseInt(color1.slice(1), 16);
            const c2 = parseInt(color2.slice(1), 16);
            
            const r1 = (c1 >> 16) & 255;
            const g1 = (c1 >> 8) & 255;
            const b1 = c1 & 255;
            
            const r2 = (c2 >> 16) & 255;
            const g2 = (c2 >> 8) & 255;
            const b2 = c2 & 255;
            
            const r = Math.round(r1 + (r2 - r1) * percent);
            const g = Math.round(g1 + (g2 - g1) * percent);
            const b = Math.round(b1 + (b2 - b1) * percent);
            
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        // Main render function
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBoard();
            drawHighlightedRows();
            drawPieces();
        }

        // AI for Player 2
        function aiUpdate() {
            const player2 = gameState.players[1];

            // Count AI's existing pieces by type
            const aiPieces = gameState.pieces.filter(p => p.player === 2 && p.health > 0);
            const pieceCounts = {

                knight: aiPieces.filter(p => p.type === 'knight').length
            };

            // Flexible AI strategy based on game state
            let pieceToBuy = null;

            // If low on pieces, focus on cheap pieces
            if (aiPieces.length < 2) {
                if (player2.coins >= 10) pieceToBuy = 'pawn';
            }
            // If have decent economy, diversify
            else if (player2.coins >= 70) {
                // Randomly decide: 50% knight, 30% rook, 20% bishop
                if (rand < 0.5) pieceToBuy = 'knight';
                else if (rand < 0.8) pieceToBuy = 'rook';
                else pieceToBuy = 'bishop';
            } 
            else if (player2.coins >= 50) {
                // Can afford rook: 40% rook, 40% bishop, 20% pawn
                if (rand < 0.4) pieceToBuy = 'rook';
                else if (rand < 0.8) pieceToBuy = 'bishop';
                else pieceToBuy = 'pawn';
            } 
            else if (player2.coins >= 30) {
                // Can afford bishop: 50% bishop, 50% pawn
                if (rand < 0.5) pieceToBuy = 'bishop';
                else pieceToBuy = 'pawn';
            } 
            else if (player2.coins >= 10) {
                pieceToBuy = 'pawn';
            }

            if (pieceToBuy) {
                // Find available spot in rows 0-1
                for (let row = 0; row <= 1; row++) {

        function getTeamMetrics(playerId) {
            const teamPieces = gameState.pieces.filter(p => p.player === playerId && p.health > 0);
            const king = teamPieces.find(p => p.type === 'king');
            const fighters = teamPieces.filter(p => p.type !== 'king');

            const totalHP = fighters.reduce((sum, p) => sum + p.health, 0);
            const totalValue = fighters.reduce((sum, p) => sum + (PIECE_DATA[p.type].cost || 0), 0);
            const totalDps = fighters.reduce((sum, p) => sum + (p.damage / (p.attackCooldown / 1000)), 0);
            const engaged = fighters.filter(p => p.behaviorState === 'engaged').length;
            const defending = fighters.filter(p => p.behaviorState === 'defending').length;
            const seeking = fighters.filter(p => p.behaviorState === 'seeking').length;

            const pressureSum = fighters.reduce((sum, p) => {
                const progress = p.player === 1 ? (7 - p.row) : p.row;
                return sum + progress;
            }, 0);
            const avgPressure = fighters.length ? (pressureSum / fighters.length) : 0;

            const kingHP = king ? king.health : 0;
            const score = (totalHP * 1.2) + (totalDps * 8) + (totalValue * 0.35) + (kingHP * 2) + (avgPressure * 3);

            return {
                fighters: fighters.length,
                totalHP,
                totalValue,
                totalDps,
                kingHP,
                engaged,
                defending,
                seeking,
                avgPressure,
                score
            };
        }

        function createAutoBoard() {
            return Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        }

        function autoIsValid(row, col) {
            return row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE;
        }

        function autoGetAdjacentEnemy(piece, pieces) {
            for (const candidate of pieces) {
                if (candidate.player === piece.player || candidate.health <= 0) {
                    continue;
                }
                const dr = Math.abs(piece.row - candidate.row);
                const dc = Math.abs(piece.col - candidate.col);
                if (dr <= 1 && dc <= 1 && dr + dc > 0) {
                    return candidate;
                }
            }
            return null;
        }

        function autoPickTarget(piece, pieces) {
            const enemies = pieces.filter(p => p.player !== piece.player && p.health > 0);
            if (enemies.length === 0) {
                return null;
            }
            return enemies.reduce((nearest, enemy) => {
                const d1 = Math.abs(piece.row - nearest.row) + Math.abs(piece.col - nearest.col);
                const d2 = Math.abs(piece.row - enemy.row) + Math.abs(piece.col - enemy.col);
                return d2 < d1 ? enemy : nearest;
            });
        }

        function autoGetPossibleMoves(piece, board) {
            const moves = [];
            if (piece.type === 'pawn') {
                const forward = piece.player === 1 ? -1 : 1;
                const dirs = [
                    [forward, 0], [forward, 1], [forward, -1], [0, 1], [0, -1]
                ];
                for (const [dr, dc] of dirs) {
                    const nr = piece.row + dr;
                    const nc = piece.col + dc;
                    if (autoIsValid(nr, nc) && !board[nr][nc]) {
                        moves.push({ row: nr, col: nc });
                    }
                }
            } else if (piece.type === 'bishop') {
                const dirs = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
                for (const [dr, dc] of dirs) {
                    for (let i = 1; i <= piece.moveRange; i++) {
                        const nr = piece.row + dr * i;
                        const nc = piece.col + dc * i;
                        if (!autoIsValid(nr, nc) || board[nr][nc]) {
                            break;
                        }
                        moves.push({ row: nr, col: nc });
                    }
                }
            } else if (piece.type === 'rook') {
                const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                for (const [dr, dc] of dirs) {
                    for (let i = 1; i <= piece.moveRange; i++) {
                        const nr = piece.row + dr * i;
                        const nc = piece.col + dc * i;
                        if (!autoIsValid(nr, nc) || board[nr][nc]) {
                            break;
                        }
                        moves.push({ row: nr, col: nc });
                    }
                }
            } else if (piece.type === 'knight') {
                const jumps = [
                    [2, 1], [2, -1], [-2, 1], [-2, -1],
                    [1, 2], [1, -2], [-1, 2], [-1, -2]
                ];
                for (const [dr, dc] of jumps) {
                    const nr = piece.row + dr;
                    const nc = piece.col + dc;
                    if (autoIsValid(nr, nc) && !board[nr][nc]) {
                        moves.push({ row: nr, col: nc });
                    }
                }
            }
            return moves;
        }

        function autoMoveToward(piece, target, board) {
            const moves = autoGetPossibleMoves(piece, board);
            if (moves.length === 0) {
                piece.behaviorState = 'defending';
                return;
            }

            const currentDist = Math.abs(piece.row - target.row) + Math.abs(piece.col - target.col);
            let best = null;
            let bestScore = Infinity;
            for (const m of moves) {
                const dist = Math.abs(m.row - target.row) + Math.abs(m.col - target.col);
                if (dist > currentDist) {
                    continue;
                }
                let score = dist;
                if (m.row === piece.prevRow && m.col === piece.prevCol) {
                    score += 1.5;
                }
                if (score < bestScore) {
                    bestScore = score;
                    best = m;
                }
            }

            if (!best || bestScore >= currentDist) {
                piece.behaviorState = 'defending';
                return;
            }

            board[piece.row][piece.col] = null;
            piece.prevRow = piece.row;
            piece.prevCol = piece.col;
            piece.row = best.row;
            piece.col = best.col;
            board[piece.row][piece.col] = piece;
            piece.behaviorState = 'seeking';
        }

        function autoSelectBuyType(coins) {
            const rand = Math.random();
            if (coins >= 70) {
                if (rand < 0.45) return 'knight';
                if (rand < 0.8) return 'rook';
                return 'bishop';
            }
            if (coins >= 50) {
                if (rand < 0.5) return 'rook';
                if (rand < 0.85) return 'bishop';
                return 'pawn';
            }
            if (coins >= 30) {
                return rand < 0.55 ? 'bishop' : 'pawn';
            }
            if (coins >= 10) {
                return 'pawn';
            }
            return null;
        }

        function autoPlaceBuy(playerId, players, pieces, board, nextIdRef) {
            const buyer = players[playerId - 1];
            const pick = autoSelectBuyType(buyer.coins);
            if (!pick) {
                return;
            }

            const cost = PIECE_DATA[pick].cost;
            if (buyer.coins < cost) {
                return;
            }

            const rows = playerId === 1 ? [7, 6] : [0, 1];
            const empty = [];
            for (const row of rows) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (!board[row][col]) {
                        empty.push({ row, col });
                    }
                }
            }

            if (empty.length === 0) {
                return;
            }

            const slot = empty[Math.floor(Math.random() * empty.length)];
            buyer.coins -= cost;
            const piece = {
                id: nextIdRef.value++,
                type: pick,
                player: playerId,
                row: slot.row,
                col: slot.col,
                prevRow: slot.row,
                prevCol: slot.col,
                health: PIECE_DATA[pick].health,
                damage: PIECE_DATA[pick].damage,
                moveRange: PIECE_DATA[pick].moveRange,
                attackCooldown: Math.max(1, Math.round(ACTION_COOLDOWN / 500)),
                attackTimer: 0,
                lockedTargetId: null,
                behaviorState: 'seeking'
            };
            pieces.push(piece);
            board[slot.row][slot.col] = piece;
        }

        function simulateAutoBattle() {
            const board = createAutoBoard();
            const players = [{ coins: 50 }, { coins: 50 }];
            const pieces = [];
            const nextIdRef = { value: 1 };

            const kingA = {
                id: nextIdRef.value++, type: 'king', player: 1, row: 7, col: 4,
                prevRow: 7, prevCol: 4, health: PIECE_DATA.king.health,
                damage: 0, moveRange: 0, attackCooldown: 9999, attackTimer: 9999,
                lockedTargetId: null, behaviorState: 'defending'
            };
            const kingB = {
                id: nextIdRef.value++, type: 'king', player: 2, row: 0, col: 4,
                prevRow: 0, prevCol: 4, health: PIECE_DATA.king.health,
                damage: 0, moveRange: 0, attackCooldown: 9999, attackTimer: 9999,
                lockedTargetId: null, behaviorState: 'defending'
            };
            pieces.push(kingA, kingB);
            board[7][4] = kingA;
            board[0][4] = kingB;

            const prepTicks = Math.max(1, Math.floor(READY_DURATION / 1000));
            for (let t = 0; t < prepTicks; t++) {
                players[0].coins += COIN_TICK_AMOUNT;
                players[1].coins += COIN_TICK_AMOUNT;
                autoPlaceBuy(1, players, pieces, board, nextIdRef);
                autoPlaceBuy(2, players, pieces, board, nextIdRef);
            }

            for (let step = 0; step < AUTO_TEST_MAX_STEPS; step++) {
                for (const p of pieces) {
                    if (p.health <= 0 || p.type === 'king') {
                        continue;
                    }

                    const adjacent = autoGetAdjacentEnemy(p, pieces);
                    if (adjacent) {
                        p.lockedTargetId = adjacent.id;
                        p.behaviorState = 'engaged';
                        continue;
                    }

                    let target = null;
                    if (p.lockedTargetId !== null) {
                        target = pieces.find(x => x.id === p.lockedTargetId && x.health > 0);
                    }
                    if (!target) {
                        target = autoPickTarget(p, pieces);
                        p.lockedTargetId = target ? target.id : null;
                    }

                    if (target) {
                        autoMoveToward(p, target, board);
                    } else {
                        p.behaviorState = 'defending';
                    }
                }

                for (const p of pieces) {
                    if (p.health <= 0 || p.type === 'king') {
                        continue;
                    }

                    if (p.attackTimer > 0) {
                        p.attackTimer -= 1;
                        continue;
                    }

                    let target = null;
                    if (p.lockedTargetId !== null) {
                        target = pieces.find(x => x.id === p.lockedTargetId && x.health > 0);
                    }
                    if (!target || !autoGetAdjacentEnemy(p, [target])) {
                        target = autoGetAdjacentEnemy(p, pieces);
                        p.lockedTargetId = target ? target.id : null;
                    }

                    if (!target) {
                        continue;
                    }

                    target.health -= p.damage;
                    p.attackTimer = Math.max(1, Math.round(ACTION_COOLDOWN / 500));
                    if (target.health <= 0) {
                        board[target.row][target.col] = null;
                    }
                }

                const p1KingAlive = pieces.some(p => p.type === 'king' && p.player === 1 && p.health > 0);
                const p2KingAlive = pieces.some(p => p.type === 'king' && p.player === 2 && p.health > 0);

                if (!p1KingAlive || !p2KingAlive) {
                    if (p1KingAlive && !p2KingAlive) return { winner: 1, steps: step + 1 };
                    if (p2KingAlive && !p1KingAlive) return { winner: 2, steps: step + 1 };
                    return { winner: 0, steps: step + 1 };
                }
            }

            const p1Score = pieces.filter(p => p.player === 1 && p.health > 0)
                .reduce((sum, p) => sum + p.health + (PIECE_DATA[p.type].cost || 0) * 0.2, 0);
            const p2Score = pieces.filter(p => p.player === 2 && p.health > 0)
                .reduce((sum, p) => sum + p.health + (PIECE_DATA[p.type].cost || 0) * 0.2, 0);

            if (Math.abs(p1Score - p2Score) < 0.5) {
                return { winner: 0, steps: AUTO_TEST_MAX_STEPS };
            }
            return { winner: p1Score > p2Score ? 1 : 2, steps: AUTO_TEST_MAX_STEPS };
        }

        function runAutoBalanceTest() {
            const input = document.getElementById('autoTestRuns');
            const resultEl = document.getElementById('autoTestResult');
            const runs = Math.max(5, Math.min(500, parseInt(input.value, 10) || 50));

            let p1Wins = 0;
            let p2Wins = 0;
            let draws = 0;
            let totalSteps = 0;

            for (let i = 0; i < runs; i++) {
                const out = simulateAutoBattle();
                totalSteps += out.steps;
                if (out.winner === 1) p1Wins += 1;
                else if (out.winner === 2) p2Wins += 1;
                else draws += 1;
            }

            const p1Rate = (p1Wins / runs) * 100;
            const p2Rate = (p2Wins / runs) * 100;
            const drawRate = (draws / runs) * 100;
            const avgLen = totalSteps / runs;

            let verdict = 'Looks roughly balanced.';
            const gap = Math.abs(p1Rate - p2Rate);
            if (gap >= 15) {
                verdict = p1Rate > p2Rate ? 'P1 side appears advantaged.' : 'P2 side appears advantaged.';
            }

            resultEl.innerHTML =
                `Results (${runs} runs): P1 ${p1Rate.toFixed(1)}% | P2 ${p2Rate.toFixed(1)}% | Draw ${drawRate.toFixed(1)}%<br>` +
                `Avg fight length: ${avgLen.toFixed(1)} ticks. ${verdict}`;
        }

        function applyPassiveIncome() {
            const now = Date.now();
            const elapsed = now - gameState.lastCoinTickAt;
            const ticks = Math.floor(elapsed / COIN_TICK_INTERVAL);

            if (ticks <= 0) {
                return;
            }

            for (const player of gameState.players) {
                player.coins += ticks * COIN_TICK_AMOUNT;
            }
            gameState.lastCoinTickAt += ticks * COIN_TICK_INTERVAL;
        }

        // Update game state
        function update() {
            updateReadyOverlay();
            applyPassiveIncome();
            if (!gameState.isMatchStarted) {
                // Let both sides buy/place during preparation, but prevent movement/attacks.
                aiUpdate();
                return;
            }

            for (const piece of gameState.pieces) {
                piece.updateAnimation();
                if (piece.health > 0) {
                    piece.update();
                    piece.updateAttack();
                }
            }
            
            // Run AI for Player 2
            aiUpdate();
        }

        // Handle canvas click
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            
            const { row, col } = screenToBoard(screenX, screenY);
            
            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;

            if (gameState.selectedPieceType && gameState.selectedPlayer) {
                placePiece(row, col);
            }
        });

        // Handle piece selection
        document.querySelectorAll('.pieceButton').forEach(button => {
            button.addEventListener('click', () => {
                const pieceType = button.dataset.piece;
                const player = parseInt(button.dataset.player);
                const playerData = gameState.players[player - 1];
                const cost = PIECE_DATA[pieceType].cost;

                // Check if player has enough coins
                if (playerData.coins < cost) {
                    setBuyFeedback(`Not enough coins for ${pieceType}. Need ${cost}.`, 'error');
                    return;
                }

                // Select piece
                document.querySelectorAll('.pieceButton').forEach(b => b.classList.remove('selected'));
                button.classList.add('selected');
                
                gameState.selectedPieceType = pieceType;
                gameState.selectedPlayer = player;
                setBuyFeedback(`Selected ${pieceType}. Click a valid tile to place.`, 'success');
            });
        });

        // Place piece on board
        function placePiece(row, col) {
            const player = gameState.selectedPlayer;
            const pieceType = gameState.selectedPieceType;
            const playerData = gameState.players[player - 1];
            const cost = PIECE_DATA[pieceType].cost;

            // Check if position is valid for this player
            const validRows = player === 1 ? [6, 7] : [0, 1];
            if (!validRows.includes(row)) {
                setBuyFeedback(`Invalid row. Player ${player} can place only on rows ${validRows.join(' and ')}.`, 'error');
                return;
            }

            // Check if position is occupied
            if (gameState.board[row][col]) {
                setBuyFeedback('That tile is occupied. Pick another tile.', 'error');
                return;
            }

            // Check cooldown when placing to avoid click feels laggy.
            const buyElapsed = Date.now() - playerData.lastBuyTime;
            if (buyElapsed < BUYING_COOLDOWN) {
                const wait = ((BUYING_COOLDOWN - buyElapsed) / 1000).toFixed(1);
                setBuyFeedback(`Shop cooling down. Wait ${wait}s before placing next piece.`, 'error');
                return;
            }

            // Check coins at place time as well.
            if (playerData.coins < cost) {
                setBuyFeedback(`Not enough coins. Need ${cost}.`, 'error');
                return;
            }

            // Deduct coins
            playerData.coins -= cost;
            playerData.lastBuyTime = Date.now();

            // Create and place piece
            const piece = new Piece(pieceType, player, row, col);
            gameState.pieces.push(piece);
            gameState.board[row][col] = piece;

            // Deselect
            document.querySelectorAll('.pieceButton').forEach(b => b.classList.remove('selected'));
            gameState.selectedPieceType = null;
            gameState.selectedPlayer = null;
            setBuyFeedback(`Placed ${pieceType} at (${row}, ${col}).`, 'success');

            updateUI();
        }

        // Update UI
        function updateUI() {
            document.getElementById('p1Coins').textContent = gameState.players[0].coins;
            document.getElementById('p2Coins').textContent = gameState.players[1].coins;

            // Pulse cooldown bar to show movement cadence in real time.
            const cooldownRemaining = ACTION_COOLDOWN - (Date.now() % ACTION_COOLDOWN);
            const cooldownPercent = (cooldownRemaining / ACTION_COOLDOWN) * 100;

            const cooldownBarFill = document.getElementById('cooldownBarFill');
            cooldownBarFill.style.width = cooldownPercent + '%';

            const cooldownText = document.getElementById('cooldownText');
            cooldownText.textContent = (cooldownRemaining / 1000).toFixed(1) + 's';

            const p1 = getTeamMetrics(1);
            const p2 = getTeamMetrics(2);
            const totalScore = p1.score + p2.score;
            const p1Edge = totalScore > 0 ? ((p1.score / totalScore) * 100) : 50;

            document.getElementById('balanceMeta').innerHTML =
                `Passive income: +${COIN_TICK_AMOUNT}/sec | Buy cooldown: ${(BUYING_COOLDOWN / 1000).toFixed(1)}s | Prep: ${(READY_DURATION / 1000)}s<br>` +
                `P1 HP ${p1.totalHP} | DPS ${p1.totalDps.toFixed(1)} | State S/E/D ${p1.seeking}/${p1.engaged}/${p1.defending} | Pressure ${p1.avgPressure.toFixed(1)}<br>` +
                `P2 HP ${p2.totalHP} | DPS ${p2.totalDps.toFixed(1)} | State S/E/D ${p2.seeking}/${p2.engaged}/${p2.defending} | Pressure ${p2.avgPressure.toFixed(1)}<br>` +
                `Live edge: P1 ${p1Edge.toFixed(0)}% vs P2 ${(100 - p1Edge).toFixed(0)}%`;

            // Update button states
            document.querySelectorAll('.pieceButton').forEach(button => {
                const player = parseInt(button.dataset.player);
                const pieceType = button.dataset.piece;
                const playerData = gameState.players[player - 1];
                const cost = PIECE_DATA[pieceType].cost;
                
                button.disabled = playerData.coins < cost;
            });
        }

        // Game loop
        function gameLoop() {
            update();
            render();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        document.getElementById('runAutoTestBtn').addEventListener('click', runAutoBalanceTest);
        renderBalancePanel();
        initGame();
        gameLoop();
    </script>
</body>
</html>
