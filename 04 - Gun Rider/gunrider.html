<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gun Rider - Artillery Battle</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        #menuBar {
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(78, 205, 196, 0.2);
            position: relative;
            z-index: 10;
        }

        #homeButton {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            letter-spacing: 0.5px;
        }

        #homeButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        #gameTitle {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a8d8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
            margin: 30px 0 20px 0;
            z-index: 20;
            letter-spacing: -1px;
            position: relative;
        }

        #gameContainer {
            position: relative;
            width: 1200px;
            height: 700px;
            border: 2px solid rgba(78, 205, 196, 0.5);
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(78, 205, 196, 0.1);
            overflow: hidden;
            margin-bottom: 20px;
            border-radius: 15px;
            z-index: 5;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            backdrop-filter: blur(5px);
            border-radius: 15px;
        }

        .startContent {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .startContent h1 {
            font-size: 72px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a8d8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .startContent p {
            font-size: 18px;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            line-height: 1.6;
        }

        .startContent button {
            padding: 16px 50px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .startContent button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(102, 126, 234, 0.6);
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            border-radius: 15px;
        }

        .gameOverContent {
            text-align: center;
            color: white;
        }

        .gameOverContent h1 {
            font-size: 60px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .gameOverContent p {
            font-size: 24px;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
        }

        .gameOverContent button {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gameOverContent button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(102, 126, 234, 0.6);
        }

        #controls {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 5;
        }

        .turnTimerBox {
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .windIndicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(78, 205, 196, 0.15);
            border: 2px solid rgba(78, 205, 196, 0.4);
            font-weight: 600;
            font-size: 14px;
            color: #4ecdc4;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.2);
        }

        .windIcon {
            font-size: 18px;
        }

        .windArrow {
            font-size: 16px;
            color: #4ecdc4;
            min-width: 20px;
        }

        .turnDot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
        }

        .turnTimer {
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.9);
            min-width: 48px;
            text-align: right;
        }

        .turnDot.p1 {
            background: #4ecdc4;
        }

        .turnDot.p2 {
            background: #ff6b6b;
        }
    </style>
</head>
<body>
    <div id="menuBar">
        <button id="homeButton" onclick="window.location.href='../index.html'">Home</button>
    </div>
    <div id="gameTitle">🎯 GUN RIDER</div>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="startScreen">
            <div class="startContent">
                <h1>🎯 GUN RIDER</h1>
                <p>Turn-based artillery battle against AI!</p>
                <p>🎮 Use ←→ Arrow Keys to move</p>
                <p>🎯 Use ↑↓ Arrow Keys to adjust angle</p>
                <p>⚡ Hold SPACEBAR to charge power</p>
                <p>🤖 Player 2 is controlled by AI</p>
                <p>💥 Destroy your opponent!</p>
                <button onclick="startGame()">START GAME</button>
            </div>
        </div>
        <div id="gameOverScreen">
            <div class="gameOverContent">
                <h1 id="winnerText">PLAYER 1 WINS!</h1>
                <p>Great shooting!</p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
        <div id="controls" aria-label="Game status indicators">
            <div class="turnTimerBox">
                <span id="turnDot" class="turnDot p1" title="Player 1's turn"></span>
                <span id="turnTimer" class="turnTimer">12.0s</span>
            </div>
            <div id="windIndicator" class="windIndicator">
                <span class="windIcon">💨</span>
                <span id="windArrow" class="windArrow">→</span>
                <span id="windValue">0.0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1200;
        canvas.height = 700;

        // Game state
        const game = {
            isRunning: false,
            currentPlayer: 1,
            winner: null,
            botThinking: false,
            botMoveTimer: 0,
            botTargetX: 0,
            botCalculatedAngle: 0,
            botCalculatedPower: 0,
            turnDelay: 0,
            waitingForTurn: false,
            cameraShake: 0,
            cameraShakeX: 0,
            cameraShakeY: 0,
            timeScale: 1,
            endSlowMo: false,
            endTimer: 0,
            maxTurnTime: 12,
            turnTimeLeft: 12
        };

        // Wind system
        const wind = {
            strength: 0,   // current wind strength (negative = left, positive = right)
            target: 0,     // target strength to ease toward
            changeTimer: 0 // seconds until next wind shift
        };

        function setNewWind() {
            // Wind changes a few times per match
            const maxStrength = 10;
            const direction = Math.random() < 0.5 ? -1 : 1;
            const strengthBias = Math.pow(Math.random(), 1.6); // bias toward lighter winds
            wind.target = direction * strengthBias * maxStrength;
            wind.changeTimer = 15 + Math.random() * 15; // 15-30 seconds
        }

        function updateWind(dt = 1) {
            // Ease current wind toward target
            const ease = 0.03 * dt;
            wind.strength += (wind.target - wind.strength) * ease;

            wind.changeTimer -= (1 / 60) * dt;
            if (wind.changeTimer <= 0) {
                setNewWind();
            }

            updateWindIndicator();
        }

        function updateWindIndicator() {
            const windValue = document.getElementById('windValue');
            const windArrow = document.getElementById('windArrow');
            if (!windValue || !windArrow) return;

            const displayValue = Math.abs(wind.strength).toFixed(0);
            windValue.textContent = displayValue;
            windArrow.textContent = wind.strength >= 0 ? '→' : '←';
        }

        function getEffectiveWind() {
            // Strongly soften high wind values (0-10) for gameplay balance
            const magnitude = Math.abs(wind.strength);
            const scaled = Math.pow(magnitude / 10, 0.5) * 10;
            return Math.sign(wind.strength) * scaled * 0.5;
        }

        // Players
        const player1 = {
            x: 150,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 45,
            power: 0,
            health: 100,
            maxHealth: 100,
            fuel: 300,
            maxFuel: 300,
            color: '#4ecdc4',
            charging: false,
            vehicleColor: '#667eea',
            groundAngle: 0,
            shake: 0,
            shakeX: 0,
            shakeY: 0
        };

        const player2 = {
            x: 1050,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 135,
            power: 0,
            health: 100,
            maxHealth: 100,
            fuel: 300,
            maxFuel: 300,
            color: '#ff6b6b',
            charging: false,
            vehicleColor: '#764ba2',
            groundAngle: 0,
            shake: 0,
            shakeX: 0,
            shakeY: 0
        };

        // Terrain
        const terrain = [];
        const terrainSegments = 60;

        // Projectile
        let projectile = null;

        // Craters system
        let craters = [];

        // Water level
        const WATER_LEVEL = 650;

        // Initialize terrain
        function initTerrain() {
            terrain.length = 0; // Clear existing terrain
            
            // Create a more defined terrain with clear slopes and flat sections
            for (let i = 0; i <= terrainSegments; i++) {
                const x = (canvas.width / terrainSegments) * i;
                const ratio = i / terrainSegments;
                let y = 550;
                
                // Section 1 (0-0.2): Flat ground on the left
                if (ratio < 0.2) {
                    y = 550;
                }
                // Section 2 (0.2-0.35): Uphill slope
                else if (ratio < 0.35) {
                    const sectionRatio = (ratio - 0.2) / 0.15;
                    y = 550 - sectionRatio * 80; // Slope up
                }
                // Section 3 (0.35-0.5): Flat at top
                else if (ratio < 0.5) {
                    y = 470;
                }
                // Section 4 (0.5-0.65): Downhill slope
                else if (ratio < 0.65) {
                    const sectionRatio = (ratio - 0.5) / 0.15;
                    y = 470 + sectionRatio * 100; // Slope down
                }
                // Section 5 (0.65-0.8): Flat valley
                else if (ratio < 0.8) {
                    y = 570;
                }
                // Section 6 (0.8-1.0): Uphill to the right
                else {
                    const sectionRatio = (ratio - 0.8) / 0.2;
                    y = 570 - sectionRatio * 60; // Slope up
                }
                
                terrain.push({ x, y });
            }
            
            // Position players on terrain
            player1.y = getTerrainHeight(player1.x) - 40;
            player1.groundAngle = getTerrainSlope(player1.x);
            
            player2.y = getTerrainHeight(player2.x) - 40;
            player2.groundAngle = getTerrainSlope(player2.x);
        }

        function getTerrainHeight(x) {
            for (let i = 0; i < terrain.length - 1; i++) {
                if (x >= terrain[i].x && x <= terrain[i + 1].x) {
                    const ratio = (x - terrain[i].x) / (terrain[i + 1].x - terrain[i].x);
                    return terrain[i].y + (terrain[i + 1].y - terrain[i].y) * ratio;
                }
            }
            return terrain[terrain.length - 1].y;
        }

        function getTerrainSlope(x) {
            // Get the angle of the slope at position x
            for (let i = 0; i < terrain.length - 1; i++) {
                if (x >= terrain[i].x && x <= terrain[i + 1].x) {
                    const dx = terrain[i + 1].x - terrain[i].x;
                    const dy = terrain[i + 1].y - terrain[i].y;
                    // Negate because in canvas +y is down, we want uphill to be positive
                    const angle = -Math.atan2(dy, dx) * 180 / Math.PI;
                    return angle;
                }
            }
            return 0;
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            game.isRunning = true;
            game.turnTimeLeft = game.maxTurnTime;
            updateTurnTimer();
            updateTurnIndicator();
            setNewWind();
            updateWindIndicator();
            
            // Record play count
            const playKey = 'game_plays_gunrider';
            const currentCount = parseInt(localStorage.getItem(playKey) || '0');
            localStorage.setItem(playKey, currentCount + 1);
        }

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            // Prevent default browser scrolling for arrow keys
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            
            if (e.key === ' ' && game.isRunning && !projectile) {
                e.preventDefault();
                const currentPlayerObj = game.currentPlayer === 1 ? player1 : player2;
                currentPlayerObj.charging = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            
            // Prevent default browser scrolling for arrow keys
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            
            if (e.key === ' ' && game.isRunning) {
                e.preventDefault();
                const currentPlayerObj = game.currentPlayer === 1 ? player1 : player2;
                if (currentPlayerObj.charging && currentPlayerObj.power > 0) {
                    fire(currentPlayerObj);
                    currentPlayerObj.charging = false;
                }
            }
        });

        function fire(player) {
            // Barrel uses player.angle in rotated canvas
            // World angle = player.angle + player.groundAngle (shown in display)
            // But for projectile physics, convert the displayed world angle back
            const worldAngle = player.angle + player.groundAngle;
            const angleRad = (worldAngle * Math.PI) / 180;
            const velocity = player.power / 5;
            
            projectile = {
                x: player.x,
                y: player.y - 20,
                vx: Math.cos(angleRad) * velocity,
                vy: -Math.sin(angleRad) * velocity,
                radius: 8,
                trail: []
            };
            
            player.power = 0;
        }

        function updateProjectile(dt = 1) {
            if (!projectile) return;
            
            // Add to trail
            projectile.trail.push({ x: projectile.x, y: projectile.y });
            if (projectile.trail.length > 20) projectile.trail.shift();
            
            // Physics
            const effectiveWind = getEffectiveWind();
            projectile.vy += 0.5 * dt; // Gravity
            projectile.vx += effectiveWind * 0.015 * dt; // Wind (half)
            projectile.x += projectile.vx * dt;
            projectile.y += projectile.vy * dt;
            
            // Check terrain collision
            const terrainY = getTerrainHeight(projectile.x);
            if (projectile.y >= terrainY) {
                createExplosion(projectile.x, terrainY);
                createCrater(projectile.x, terrainY);
                checkHit(projectile.x, terrainY);
                projectile = null;
                switchTurn();
                return;
            }
            
            // Check player collision
            const checkPlayer = game.currentPlayer === 1 ? player2 : player1;
            const dx = projectile.x - checkPlayer.x;
            const dy = projectile.y - checkPlayer.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 30) {
                const damage = 20 + Math.random() * 15;
                checkPlayer.health = Math.max(0, checkPlayer.health - damage);
                
                // Apply knockback effect - push away from projectile
                const knockbackDir = Math.sign(checkPlayer.x - projectile.x);
                checkPlayer.vx = knockbackDir * 3; // Horizontal knockback
                checkPlayer.vy -= 2; // Upward knockback
                
                // Trigger character shake
                checkPlayer.shake = 15;
                
                // Trigger camera shake
                game.cameraShake = 12;
                
                createExplosion(projectile.x, projectile.y);
                projectile = null;
                
                if (checkPlayer.health <= 0) {
                    endGame(game.currentPlayer);
                } else {
                    switchTurn();
                }
                return;
            }
            
            // Check boundaries
            if (projectile.x < 0 || projectile.x > canvas.width || projectile.y > canvas.height) {
                projectile = null;
                switchTurn();
            }
        }

        let explosionParticles = [];

        function createExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                explosionParticles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    size: Math.random() * 5 + 2,
                    color: `hsl(${Math.random() * 60 + 20}, 100%, 60%)`
                });
            }
        }

        function createCrater(x, y) {
            // Modify terrain to create an actual crater/hole
            const craterRadius = 60;
            const craterDepth = 50; // Back to original depth
            
            // Find all terrain points within crater radius and lower them
            for (let i = 0; i < terrain.length; i++) {
                const point = terrain[i];
                const distance = Math.abs(point.x - x);
                
                if (distance < craterRadius) {
                    // Create a smooth crater depression using cosine falloff
                    const falloff = Math.cos((distance / craterRadius) * Math.PI / 2);
                    const depression = craterDepth * falloff;
                    point.y += depression; // Lower the terrain (no limit - can go infinitely deep)
                }
            }
            
            // Smooth the terrain to avoid too many sharp peaks and valleys
            smoothTerrain();
            
            // Don't instantly snap players - they will fall with gravity
            // Just update ground angle for when they land
            player1.groundAngle = getTerrainSlope(player1.x);
            player2.groundAngle = getTerrainSlope(player2.x);
        }
        
        function smoothTerrain() {
            // Apply smoothing to reduce sharp ups and downs
            const smoothingPasses = 2;
            const smoothingStrength = 0.3; // How much to blend with neighbors
            
            for (let pass = 0; pass < smoothingPasses; pass++) {
                const newHeights = [];
                
                for (let i = 0; i < terrain.length; i++) {
                    if (i === 0 || i === terrain.length - 1) {
                        // Keep endpoints unchanged
                        newHeights[i] = terrain[i].y;
                    } else {
                        // Blend with neighbors to smooth out sharp transitions
                        const current = terrain[i].y;
                        const prev = terrain[i - 1].y;
                        const next = terrain[i + 1].y;
                        const average = (prev + current + next) / 3;
                        
                        // Mix between current and average based on smoothing strength
                        newHeights[i] = current + (average - current) * smoothingStrength;
                        
                        // No depth limit - terrain can be carved infinitely deep
                    }
                }
                
                // Apply the new heights
                for (let i = 0; i < terrain.length; i++) {
                    terrain[i].y = newHeights[i];
                }
            }
        }
        
        function updatePlayerGravity(player, dt = 1) {
            // Apply horizontal velocity from knockback
            player.x += player.vx * dt;
            
            // Apply friction to horizontal velocity
            player.vx *= Math.pow(0.92, dt); // Friction/drag
            
            // Stop very small velocities
            if (Math.abs(player.vx) < 0.1) {
                player.vx = 0;
            }
            
            // Keep players in bounds
            player.x = Math.max(50, Math.min(1150, player.x));
            
            const terrainY = getTerrainHeight(player.x);
            const playerBottom = player.y + 40; // Player is 40 pixels tall
            
            // Check if player fell into water (die when mostly submerged - 30 pixels into water)
            if (playerBottom >= WATER_LEVEL + 30) {
                const winner = player === player1 ? 2 : 1;
                endGame(winner);
                return;
            }
            
            // Only collide with terrain if it's above water level
            // If terrain is underwater, player falls through it
            if (terrainY < WATER_LEVEL) {
                // Terrain is above water - normal collision
                if (playerBottom < terrainY) {
                    player.vy += 0.6 * dt; // Gravity acceleration
                    player.y += player.vy * dt;
                    
                    // Landing
                    if (player.y + 40 >= terrainY) {
                        player.y = terrainY - 40;
                        player.vy = 0;
                    }
                } else {
                    // On ground
                    player.y = terrainY - 40;
                    player.vy = 0;
                }
            } else {
                // Terrain is underwater - player falls through
                player.vy += 0.6 * dt; // Gravity acceleration
                player.y += player.vy * dt;
            }
        }

        function updateExplosions(dt = 1) {
            explosionParticles = explosionParticles.filter(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.3 * dt;
                p.life -= 0.02 * dt;
                return p.life > 0;
            });
        }

        function checkHit(x, y) {
            const dist1 = Math.sqrt((x - player1.x) ** 2 + (y - player1.y) ** 2);
            const dist2 = Math.sqrt((x - player2.x) ** 2 + (y - player2.y) ** 2);
            
            if (dist1 < 60) {
                const damage = 10;
                player1.health = Math.max(0, player1.health - damage);
                
                // Apply knockback from explosion
                const knockbackDir1 = Math.sign(player1.x - x);
                player1.vx = knockbackDir1 * 2;
                player1.vy -= 1.25;
                
                // Trigger effects when hit
                player1.shake = 12;
                game.cameraShake = 10;
                
                if (player1.health <= 0) endGame(2);
            }
            if (dist2 < 60) {
                const damage = 10;
                player2.health = Math.max(0, player2.health - damage);
                
                // Apply knockback from explosion
                const knockbackDir2 = Math.sign(player2.x - x);
                player2.vx = knockbackDir2 * 2;
                player2.vy -= 1.25;
                
                // Trigger effects when hit
                player2.shake = 12;
                game.cameraShake = 10;
                
                if (player2.health <= 0) endGame(1);
            }
        }

        function switchTurn() {
            // Set delay before actually switching
            game.waitingForTurn = true;
            game.turnDelay = 90; // 1.5 second delay at 60fps
        }
        
        function processTurnSwitch() {
            game.currentPlayer = game.currentPlayer === 1 ? 2 : 1;
            const currentPlayerObj = game.currentPlayer === 1 ? player1 : player2;
            // Refuel at the start of each turn
            currentPlayerObj.fuel = currentPlayerObj.maxFuel;
            game.turnTimeLeft = game.maxTurnTime;
            updateTurnTimer();
            updateTurnIndicator();
            
            // If it's bot's turn (Player 2), start thinking
            if (game.currentPlayer === 2) {
                game.botThinking = true;
                game.botMoveTimer = 0;
                botCalculateMove();
            }
            
            game.waitingForTurn = false;
        }

        function updateTurnIndicator() {
            const turnDot = document.getElementById('turnDot');
            if (!turnDot) return;
            if (game.currentPlayer === 1) {
                turnDot.classList.remove('p2');
                turnDot.classList.add('p1');
                turnDot.title = "Player 1's turn";
            } else {
                turnDot.classList.remove('p1');
                turnDot.classList.add('p2');
                turnDot.title = "Player 2's turn";
            }
        }

        function updateTurnTimer() {
            const turnTimer = document.getElementById('turnTimer');
            if (!turnTimer) return;
            turnTimer.textContent = `${game.turnTimeLeft.toFixed(1)}s`;
        }

        // Bot AI
        function botCalculateMove() {
            // Decide on target position (move closer or find better ground)
            const distanceToEnemy = Math.abs(player2.x - player1.x);
            
            // Try to get to optimal range (350-550 pixels away)
            if (distanceToEnemy > 600) {
                game.botTargetX = player2.x - 120 - Math.random() * 80; // Move closer (toward left where P1 is)
            } else if (distanceToEnemy < 300) {
                game.botTargetX = player2.x + 80 + Math.random() * 60; // Move away (toward right)
            } else {
                game.botTargetX = player2.x + (Math.random() - 0.5) * 60; // Small adjustment
            }
            
            // Keep within bounds
            game.botTargetX = Math.max(150, Math.min(canvas.width - 150, game.botTargetX));
            
            // Calculate angle and power to hit player 1
            const dx = player2.x - player1.x; // Positive value (distance to target on left)
            const dy = player1.y - player2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // Calculate as if shooting right, then mirror it for shooting left
            let baseAngle = Math.atan2(-dy, dx) * 180 / Math.PI;
            
            // Adjust for projectile arc - aim higher for longer distances
            const arcAdjustment = Math.min(20, distance / 35);
            baseAngle += arcAdjustment;

            // Wind compensation (rough)
            const effectiveWind = getEffectiveWind();
            baseAngle += effectiveWind * 0.1;
            
            // Add some inaccuracy to make it challenging but fair (±10 degrees)
            const inaccuracy = (Math.random() - 0.5) * 20;
            baseAngle += inaccuracy;
            
            // Mirror the angle: flip it to shoot left instead of right
            game.botCalculatedAngle = 180 - Math.max(15, Math.min(85, baseAngle));
            
            // Power based on distance
            const basePower = Math.min(90, (distance / 7) + 30 + Math.abs(effectiveWind) * 0.25);
            const powerVariation = (Math.random() - 0.5) * 18; // ±9 power
            game.botCalculatedPower = Math.max(40, Math.min(100, basePower + powerVariation));
        }

        function updateBot() {
            if (!game.botThinking || game.currentPlayer !== 2) return;
            
            game.botMoveTimer++;
            
            // Phase 1: Move to target position (first 60 frames)
            if (game.botMoveTimer < 60 && player2.fuel > 0) {
                const diff = game.botTargetX - player2.x;
                if (Math.abs(diff) > 5) {
                    const moveDirection = diff > 0 ? 1 : -1;
                    const newX = player2.x + moveDirection * 3;
                    
                    // Check bounds and distance to player 1
                    if (newX > 50 && newX < canvas.width - 50 && Math.abs(newX - player1.x) > 100) {
                        player2.x = newX;
                        // Don't snap Y, let gravity handle it
                        player2.fuel = Math.max(0, player2.fuel - 2);
                    } else {
                        game.botMoveTimer = 60; // Skip to next phase if can't move
                    }
                }
            }
            
            // Phase 2: Adjust angle (frames 60-90)
            if (game.botMoveTimer >= 60 && game.botMoveTimer < 90) {
                const angleDiff = game.botCalculatedAngle - player2.angle;
                if (Math.abs(angleDiff) > 2) {
                    player2.angle += angleDiff > 0 ? 2 : -2;
                    player2.angle = Math.max(10, Math.min(170, player2.angle));
                }
            }
            
            // Phase 3: Charge and fire (frames 90+)
            if (game.botMoveTimer >= 90) {
                if (!player2.charging) {
                    player2.charging = true;
                    player2.power = 0;
                }
                
                if (player2.power < game.botCalculatedPower) {
                    player2.power = Math.min(game.botCalculatedPower, player2.power + 2);
                } else {
                    // Fire!
                    fire(player2);
                    player2.charging = false;
                    game.botThinking = false;
                }
            }
        }

        function endGame(winner) {
            if (game.endSlowMo) return;
            game.winner = winner;
            game.endSlowMo = true;
            game.endTimer = 90; // ~1.5s at 60fps
            game.timeScale = 0.35;
            game.waitingForTurn = true;
        }

        function update() {
            if (!game.isRunning) return;

            const dt = game.timeScale;

            updateWind(dt);

            if (game.endSlowMo) {
                game.endTimer--;
                if (game.endTimer <= 0) {
                    game.isRunning = false;
                    game.timeScale = 1;
                    document.getElementById('winnerText').textContent = `PLAYER ${game.winner} WINS!`;
                    document.getElementById('gameOverScreen').style.display = 'flex';
                    return;
                }
            }
            
            // Handle turn delay countdown (physics continues, just delay turn switch)
            if (game.waitingForTurn && !game.endSlowMo) {
                game.turnDelay--;
                if (game.turnDelay <= 0) {
                    processTurnSwitch();
                }
                // Continue with physics updates below, just skip input
            }

            // Turn timer countdown (only when player can act)
            if (!game.waitingForTurn && !game.endSlowMo && !projectile) {
                game.turnTimeLeft = Math.max(0, game.turnTimeLeft - (1 / 60) * dt);
                updateTurnTimer();
                if (game.turnTimeLeft <= 0) {
                    switchTurn();
                }
            }
            
            const currentPlayerObj = game.currentPlayer === 1 ? player1 : player2;
            const otherPlayerObj = game.currentPlayer === 1 ? player2 : player1;
            
            // Bot AI update (skip if waiting for turn)
            if (game.currentPlayer === 2 && !game.waitingForTurn && !game.endSlowMo) {
                updateBot();
            }
            
            // Movement controls (only when not firing and has fuel) - PLAYER 1 ONLY
            if (game.currentPlayer === 1 && !projectile && !currentPlayerObj.charging && currentPlayerObj.fuel > 0 && !game.waitingForTurn && !game.endSlowMo) {
                    const moveSpeed = 1.2; // Reduced movement speed
                
                if (keys['ArrowLeft']) {
                    const newX = currentPlayerObj.x - moveSpeed;
                    // Don't go off screen or too close to other player
                    if (newX > 50 && Math.abs(newX - otherPlayerObj.x) > 100) {
                        currentPlayerObj.x = newX;
                        // Don't snap Y, let gravity handle it
                            const newSlope = getTerrainSlope(newX);
                        currentPlayerObj.groundAngle = getTerrainSlope(currentPlayerObj.x);
                            // More fuel cost going uphill (positive slope when moving left), less downhill
                            const fuelCost = newSlope > 0 ? 3 : 1.5;
                        currentPlayerObj.fuel = Math.max(0, currentPlayerObj.fuel - fuelCost);
                    }
                }
                if (keys['ArrowRight']) {
                    const newX = currentPlayerObj.x + moveSpeed;
                    // Don't go off screen or too close to other player
                    if (newX < canvas.width - 50 && Math.abs(newX - otherPlayerObj.x) > 100) {
                        currentPlayerObj.x = newX;
                        // Don't snap Y, let gravity handle it
                            const newSlope = getTerrainSlope(newX);
                        currentPlayerObj.groundAngle = getTerrainSlope(currentPlayerObj.x);
                            // More fuel cost going uphill (negative slope when moving right), less downhill
                            const fuelCost = newSlope < 0 ? 3 : 1.5;
                        currentPlayerObj.fuel = Math.max(0, currentPlayerObj.fuel - fuelCost);
                    }
                }
            }
            
            // Angle control - PLAYER 1 ONLY
            if (game.currentPlayer === 1 && !game.waitingForTurn && !game.endSlowMo) {
                if (keys['ArrowUp'] && !keys['ArrowLeft'] && !keys['ArrowRight']) {
                    currentPlayerObj.angle = Math.min(170, currentPlayerObj.angle + 2);
                }
                if (keys['ArrowDown'] && !keys['ArrowLeft'] && !keys['ArrowRight']) {
                    currentPlayerObj.angle = Math.max(10, currentPlayerObj.angle - 2);
                }
            }
            
            // Power charging - PLAYER 1 ONLY (block during waiting)
            if (game.currentPlayer === 1 && currentPlayerObj.charging && !projectile && !game.waitingForTurn && !game.endSlowMo) {
                currentPlayerObj.power = Math.min(100, currentPlayerObj.power + 2 * dt);
            }
            
            // Apply gravity to both players so they fall into craters
            updatePlayerGravity(player1, dt);
            updatePlayerGravity(player2, dt);
            
            // Update shake effects
            updateShake();
            
            updateProjectile(dt);
            updateExplosions(dt);
        }
        
        function updateShake() {
            // Update camera shake
            if (game.cameraShake > 0) {
                game.cameraShake--;
                game.cameraShakeX = (Math.random() - 0.5) * 8;
                game.cameraShakeY = (Math.random() - 0.5) * 8;
            } else {
                game.cameraShakeX = 0;
                game.cameraShakeY = 0;
            }
            
            // Update player character shake
            if (player1.shake > 0) {
                player1.shake--;
                player1.shakeX = (Math.random() - 0.5) * 4;
                player1.shakeY = (Math.random() - 0.5) * 4;
            } else {
                player1.shakeX = 0;
                player1.shakeY = 0;
            }
            
            if (player2.shake > 0) {
                player2.shake--;
                player2.shakeX = (Math.random() - 0.5) * 4;
                player2.shakeY = (Math.random() - 0.5) * 4;
            } else {
                player2.shakeX = 0;
                player2.shakeY = 0;
            }
        }

        function drawTerrain() {
            ctx.fillStyle = '#2d5016';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let point of terrain) {
                ctx.lineTo(point.x, point.y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();
            
            // Grass top
            ctx.strokeStyle = '#4a7c1f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, terrain[0].y);
            for (let point of terrain) {
                ctx.lineTo(point.x, point.y);
            }
            ctx.stroke();
        }

        function drawWater() {
            // Water body
            ctx.fillStyle = 'rgba(52, 152, 219, 0.6)';
            ctx.fillRect(0, WATER_LEVEL, canvas.width, canvas.height - WATER_LEVEL);
            
            // Wave animation
            ctx.strokeStyle = 'rgba(52, 152, 219, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += 15) {
                const waveOffset = Math.sin(x * 0.02 + Date.now() * 0.003) * 3;
                if (x === 0) ctx.moveTo(x, WATER_LEVEL + waveOffset);
                else ctx.lineTo(x, WATER_LEVEL + waveOffset);
            }
            ctx.stroke();
            
            // Water surface line
            ctx.strokeStyle = 'rgba(100, 180, 220, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, WATER_LEVEL);
            ctx.lineTo(canvas.width, WATER_LEVEL);
            ctx.stroke();
        }

        function drawPlayer(player, isActive) {
            ctx.save();
            // Apply character shake
            ctx.translate(player.x + player.shakeX, player.y + player.shakeY);
            // Rotate based on ground slope (negate to get correct tilt direction)
            ctx.rotate(-player.groundAngle * Math.PI / 180);
            
            // Vehicle body
            ctx.fillStyle = player.vehicleColor;
            ctx.beginPath();
            ctx.roundRect(-25, -10, 50, 25, 5);
            ctx.fill();
            
            // Wheels
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-15, 20, 8, 0, Math.PI * 2);
            ctx.arc(15, 20, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Character (cute blob)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.ellipse(0, -25, 12, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-5, -27, 3, 0, Math.PI * 2);
            ctx.arc(5, -27, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-5, -27, 1.5, 0, Math.PI * 2);
            ctx.arc(5, -27, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Gun barrel
            if (isActive && !projectile) {
                // In rotated canvas, just use player.angle directly
                const barrelAngleRad = (player.angle * Math.PI) / 180;
                const barrelLength = 35;
                ctx.strokeStyle = player.vehicleColor;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(Math.cos(barrelAngleRad) * barrelLength, -Math.sin(barrelAngleRad) * barrelLength - 15);
                ctx.stroke();
                
                // Angle indicator (show world angle, what barrel is actually pointing at)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '12px Poppins';
                const worldAngle = player.angle + player.groundAngle;
                ctx.fillText(`${Math.round(worldAngle)}°`, -15, -45);
            }
            
            ctx.restore();
            
            // Health/Fuel bars (top corners)
            const barWidth = 120;
            const barHeight = 12;
            const barY = 14;
            const iconSize = 14;
            const iconGap = 8;
            const panelPad = 14;
            const barX = player === player1
                ? panelPad + iconSize + iconGap
                : canvas.width - panelPad - iconSize - iconGap - barWidth;
            const iconX = player === player1 ? panelPad : barX - iconGap - iconSize;

            // Health icon (heart)
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            const hx = iconX + iconSize / 2;
            const hy = barY + iconSize / 2 - 1;
            ctx.moveTo(hx, hy + 4);
            ctx.bezierCurveTo(hx - 6, hy - 2, hx - 8, hy + 6, hx, hy + 9);
            ctx.bezierCurveTo(hx + 8, hy + 6, hx + 6, hy - 2, hx, hy + 4);
            ctx.fill();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(barX, barY, barWidth, barHeight);

            const healthWidth = (player.health / player.maxHealth) * barWidth;
            ctx.fillStyle = player.health > 50 ? '#2ecc71' : player.health > 25 ? '#f7b731' : '#ff6b6b';
            ctx.fillRect(barX, barY, healthWidth, barHeight);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barWidth, barHeight);

            // Fuel icon (gas pump)
            const fuelBarY = barY + 20;
            ctx.fillStyle = '#f7b731';
            ctx.fillRect(iconX + 2, fuelBarY, iconSize - 4, iconSize);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillRect(iconX + 4, fuelBarY + 2, iconSize - 8, 4);
            ctx.strokeStyle = 'rgba(20, 20, 30, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(iconX + iconSize - 2, fuelBarY + 3);
            ctx.lineTo(iconX + iconSize + 6, fuelBarY + 3);
            ctx.lineTo(iconX + iconSize + 6, fuelBarY + 10);
            ctx.stroke();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(barX, fuelBarY, barWidth, barHeight);

            const fuelWidth = (player.fuel / player.maxFuel) * barWidth;
            ctx.fillStyle = player.fuel > 50 ? '#f7b731' : player.fuel > 25 ? '#ff9f43' : '#ee5a6f';
            ctx.fillRect(barX, fuelBarY, fuelWidth, barHeight);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, fuelBarY, barWidth, barHeight);
        }

        function drawPowerBar(player) {
            if (!player.charging || projectile) return;
            
            const barWidth = 100;
            const barHeight = 15;
            const barX = player.x - barWidth / 2;
            const barY = player.y + 40;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            
            const powerWidth = (player.power / 100) * barWidth;
            const gradient = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
            gradient.addColorStop(0, '#4ecdc4');
            gradient.addColorStop(1, '#667eea');
            ctx.fillStyle = gradient;
            ctx.fillRect(barX, barY, powerWidth, barHeight);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Poppins';
            ctx.textAlign = 'center';
            ctx.fillText(`${Math.round(player.power)}%`, player.x, barY + 12);
        }

        function drawProjectile() {
            if (!projectile) return;
            
            // Trail
            ctx.strokeStyle = 'rgba(255, 200, 100, 0.5)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let i = 0; i < projectile.trail.length; i++) {
                const point = projectile.trail[i];
                if (i === 0) ctx.moveTo(point.x, point.y);
                else ctx.lineTo(point.x, point.y);
            }
            ctx.stroke();
            
            // Projectile
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ff9900';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawExplosions() {
            explosionParticles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function draw() {
            // Sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#2d3561');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Apply camera shake
            ctx.save();
            ctx.translate(game.cameraShakeX, game.cameraShakeY);
            
            drawTerrain();
            
            const currentPlayerObj = game.currentPlayer === 1 ? player1 : player2;
            
            drawPlayer(player1, game.currentPlayer === 1);
            drawPlayer(player2, game.currentPlayer === 2);
            
            drawPowerBar(currentPlayerObj);
            drawProjectile();
            drawExplosions();
            
            // Draw water on top so it covers submerged players
            drawWater();
            
            ctx.restore();
            
            // Player labels
            ctx.fillStyle = player1.color;
            ctx.font = 'bold 14px Poppins';
            ctx.textAlign = 'center';
            ctx.fillText('P1', player1.x, player1.y + 60);
            
            ctx.fillStyle = player2.color;
            ctx.fillText('P2', player2.x, player2.y + 60);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize terrain on load
        initTerrain();
        gameLoop();
    </script>
</body>
</html>
